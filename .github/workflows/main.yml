name: Build Auto Iron Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build mod
        working-directory: auto-iron-mod-FRESH-GITHUB-READY
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: auto-iron-mod
          path: auto-iron-mod-FRESH-GITHUB-READY/build/libs/*.jar
